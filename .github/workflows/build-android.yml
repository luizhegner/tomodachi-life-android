name: Tomodachi Life Android (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomodachi-android
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Check private input configuration
        shell: pwsh
        env:
          DUMP_ZIP_URL: ${{ secrets.DUMP_ZIP_URL }}
        run: |
          if ($env:DUMP_ZIP_URL -notmatch '^https://') {
            throw 'Set the DUMP_ZIP_URL Actions secret to a private, direct HTTPS download URL.'
          }

      - name: Check out TomodachiLife-recomp v1.0.3
        uses: actions/checkout@v4
        with:
          repository: josiahg2502-glitch/TomodachiLife-recomp
          ref: b7ba15075e7303f79b2f941f09d30003f49aa80c
          path: recomp
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure Android tools
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          $ndk = Join-Path $sdk 'ndk/27.3.13750724'
          if (!(Test-Path (Join-Path $ndk 'sources/third_party/shaderc/third_party/glslang/Android.mk'))) {
            throw 'The Windows runner needs Android NDK r27d with glslang sources.'
          }
          if (!(Test-Path (Join-Path $sdk 'platforms/android-35/android.jar'))) {
            throw 'The Windows runner needs Android SDK Platform 35.'
          }
          "ANDROID_NDK_ROOT=$ndk" >> $env:GITHUB_ENV
          "JAVA_HOME=$env:JAVA_HOME_17_X64" >> $env:GITHUB_ENV
          "$env:JAVA_HOME_17_X64/bin" >> $env:GITHUB_PATH

      - name: Download and extract the private dump
        shell: pwsh
        env:
          DUMP_ZIP_URL: ${{ secrets.DUMP_ZIP_URL }}
        run: |
          $dump = Join-Path $env:GITHUB_WORKSPACE 'dump'
          $zip = Join-Path $env:RUNNER_TEMP 'tomodachi-dump.zip'
          New-Item -ItemType Directory -Path $dump | Out-Null
          try {
            curl.exe --fail --silent --location --proto '=https' --proto-redir '=https' --retry 2 --output $zip -- $env:DUMP_ZIP_URL
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the dump. Check the private link and its expiration.' }
            tar.exe -xf $zip -C $dump
            if ($LASTEXITCODE -ne 0) { throw 'The download must be a ZIP with exefs and romfs at its root.' }
          } finally {
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
          }
          foreach ($file in 'exefs/main', 'exefs/sdk', 'exefs/main.npdm') {
            if (!(Test-Path (Join-Path $dump $file) -PathType Leaf)) { throw "Missing dump file: $file" }
          }
          foreach ($folder in 'romfs/Layout', 'romfs/Mii', 'romfs/Pack') {
            if (!(Test-Path (Join-Path $dump $folder) -PathType Container)) { throw "Missing dump folder: $folder" }
          }

      - name: Translate the game code for the Android build
        working-directory: recomp
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Reuse the upstream installer downloads and their checksum checks.
          @'
          import sys
          from types import SimpleNamespace
          sys.path.insert(0, "scripts")
          import install
          install.fetch("llvm")
          if not install.find_runtime(SimpleNamespace(runtime=None, no_runtime=False)):
              raise SystemExit("The pinned upstream runtime could not be downloaded")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $runtime = Get-Item 'deps/tomodachi-runtime-94537ac2f4.zip'
          foreach ($stage in 'convert', 'tables', 'lift', 'sdk') {
            python scripts/setup.py --dump ../dump --build build --runtime $runtime.FullName --jobs 2 --only $stage
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/launcher_art.py ../dump build --fonts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify the signed ARM64 APK
        working-directory: recomp
        shell: pwsh
        run: |
          python scripts/android/build_libs.py --abi arm64-v8a --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = Join-Path $env:GITHUB_WORKSPACE 'android-output'
          $apk = Join-Path $output 'TomodachiLife-arm64-v8a.apk'
          python scripts/android/build_apk.py --abi arm64-v8a --libs build-android/libs/arm64-v8a --out $apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signer = Get-Item (Join-Path $env:ANDROID_HOME 'build-tools/35.0.0/apksigner.bat')
          & $signer.FullName verify $apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $state = Get-Content build/state.json -Raw | ConvertFrom-Json
          $game = Join-Path $output 'TomodachiLife/game'
          New-Item -ItemType Directory -Path $game | Out-Null
          foreach ($file in 'main.elf', 'sdk.elf', 'main.npdm') {
            Copy-Item "build/binaries/$($state.game_version)/$file" $game
          }
          Copy-Item runtime/fonts_open (Join-Path $output 'TomodachiLife/fonts') -Recurse
          if (Test-Path build/work/ui) {
            Copy-Item build/work/ui (Join-Path $output 'TomodachiLife/ui') -Recurse
          }

      - name: Save the APK and required support files
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLife-Android-ARM64
          path: android-output/
          if-no-files-found: error
          retention-days: 1
